# tmux 配置（轻量现代版，macOS / Ubuntu 通用）
# 重载：prefix + r
# prefix 保持默认 Ctrl-B

# ------------------------------ 基础 ------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB"   # true color（tmux >= 3.2）
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g escape-time 10
set -g allow-passthrough on   # 允许在 tmux 里显示图片（yazi 等）
set -g set-clipboard on       # OSC 52：本机 / SSH 都能复制到客户端剪贴板
setw -g mode-keys vi

# ------------------------------ 分屏 / 新窗口 ------------------------------
unbind '"'
unbind %
bind - splitw -v -c '#{pane_current_path}'   # 上下分屏，保持当前目录
bind | splitw -h -c '#{pane_current_path}'   # 左右分屏，保持当前目录
bind c new-window -c '#{pane_current_path}'

# ------------------------------ 窗格切换 / 调整大小 ------------------------------
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r ^k resizep -U 10
bind -r ^j resizep -D 10
bind -r ^h resizep -L 10
bind -r ^l resizep -R 10

# Alt + 方向键直接切换窗格（不需要 prefix）
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ------------------------------ 复制模式 ------------------------------
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel   # 由 set-clipboard 写入系统剪贴板
# 若某个终端不支持 OSC 52，可改用本机剪贴板工具：
#   macOS : bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
#   Linux : bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
#           bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# ------------------------------ 重载配置 ------------------------------
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# ------------------------------ 外观 ------------------------------
set -g status-interval 5
set -g status-style "bg=default,fg=colour250"
set -g status-left "#[fg=colour114,bold] #S #[default]"
set -g status-right "#[fg=colour245]#{pane_current_path} #[fg=colour114]%H:%M "
set -g window-status-current-style "fg=colour114,bold"
set -g window-status-separator " "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour114"
set -g message-style "bg=default,fg=colour114"
set -g display-time 2000

# ------------------------------ 插件（可选，需要 TPM） ------------------------------
# 首次使用：git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# 然后进入 tmux 按 prefix + I 安装插件
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-dir '$HOME/.tmux/resurrect'

# 只有安装了 TPM 才初始化，避免报错
if-shell 'test -d ~/.tmux/plugins/tpm' 'run -b ~/.tmux/plugins/tpm/tpm'
